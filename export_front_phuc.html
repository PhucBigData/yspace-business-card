  <style>
    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    @page {
      size: 90mm 54mm;
      margin: 0;
    }

    @media print {
      html, body {
        width: 90mm !important;
        height: 54mm !important;
        margin: 0 !important;
        padding: 0 !important;
        background: transparent !important;
        display: block !important;
      }
      .no-print {
        display: none !important;
      }
      .stage-wrapper {
        padding: 0 !important;
        margin: 0 !important;
        background: transparent !important;
        min-height: auto !important;
        display: block !important;
      }
      .scale-wrapper {
        transform: none !important;
        margin: 0 !important;
      }
      .print-page-break {
        page-break-after: always !important;
      }
      .business-card {
        width: 90mm !important;
        height: 54mm !important;
        margin: 0 !important;
        box-shadow: none !important;
        border: none !important;
        border-radius: 0 !important;
        page-break-inside: avoid !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }

    /* Thu phóng màn hình */
    .zoom-100 { transform: scale(1); }
    .zoom-150 { transform: scale(1.35); }
    .zoom-200 { transform: scale(1.6); }

    /* Hiệu ứng viền phát sáng thẻ công nghệ */
    .cyber-border {
      position: relative;
    }
    .cyber-border::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(230,27,95,0.7) 0%, rgba(255,42,117,0.2) 40%, rgba(30,41,59,0.3) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
  </style>
